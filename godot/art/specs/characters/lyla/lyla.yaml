spritekiln: 1
name: lyla
kind: character
extends: humanoid
remove: [use.sword]
size: 128
camera: {pitch: 38, scale: 0.028, center: [0, 0.98, 0]}
directions: 8
mirror: false
# Preview modeling reference: the five-pose turnaround uploaded in ChatGPT on 2026-11-12.
# No photographic file is embedded in this YAML. The visual design is specified below.
brief:
  summary: >
    Lyla, a petite high-fantasy female armored swordswoman / guardian with very
    long flowing peach-strawberry blonde hair, a large dark wine-red ribbon bow,
    vivid red eyes, fitted black-brown armor with antique-gold edging, a red
    waist sash and a long torn crimson cape; lively anime facial proportions.
  head: >
    Young anime-style face, large deep ruby eyes, straight wispy layered bangs,
    warm peach blonde crown and extremely long abundant flowing hair past the
    lower back. Hair is half-up into a high ponytail tied by a prominent dark
    burgundy bow. Distinct long face-framing curls on both sides.
  must_keep:
    - large wine-red ribbon bow high on the back of the head
    - very long peach-blonde hair reaching below the waist, visible especially from behind
    - strong crimson cape with ragged torn hem behind the legs
    - dark brown-black segmented armor with elegant antique-gold borders
    - red sash wrapping the waist, central hanging tabard
    - ruby-red eyes
    - rounded shoulder pauldrons and dark heavy leather boots
  simplify:
    - retain precise silhouette, distinct layered hair locks, and readable panel divisions rather than every hairline
    - represent ornate gold etching as readable surface paint and sharply separated accents
    - do not add a sword: the five-view reference depicts an empty-handed figure
    - no glow, halo, cape-balloon silhouette or new accessories
ramps:
  peach_hair: ["#513039", "#834653", "#ac6064", "#d88473", "#f2a782", "#ffd5a2", "#ffe5b6"]
  armor_black: ["#151118", "#24202b", "#38303a", "#4b3940", "#645052", "#8a6e64"]
  aged_gold: ["#33221e", "#6f4936", "#aa774b", "#d6a061", "#f3cc82"]
  ruby: ["#310e23", "#751a2c", "#b72e37", "#e45c47", "#ffad7e"]
  ribbon_wine: ["#350e22", "#65182c", "#982a37", "#c74445", "#e66a58"]
  cape_red: ["#320b1b", "#641427", "#8c2130", "#b92d37", "#dc4a48", "#ed6c5b"]
materials:
  skin: {ramp: skin, gamma: 0.75}
  armor: {ramp: armor_black, finish: metal, edge_highlight: true, crease: true}
  leather: {ramp: armor_black, finish: soft}
  hair: {ramp: peach_hair, finish: soft}
  trim: {ramp: aged_gold, finish: metal, edge_highlight: true}
  crimson: {ramp: cape_red, finish: soft, crease: true}
  wine: {ramp: ribbon_wine, finish: soft}
  cloth_dark: {ramp: armor_black, finish: soft}
  eye_red: {ramp: ruby, band: 3, outline: false}
# Override only selected base template pieces; base humanoid keeps working IK and animations.
use:
  - {kit: head, at: head, with: {width: 1.0, jaw: 0.30, chin: 0.40, nose: 0, ears: 0}}
  - {kit: hair, at: head, with: {fringe: 0.88, part: 0.12, locks: 1.7, length: 0.8, volume: 1.15}}
parts:
  torso:
    material: armor
    space: pelvis
    blend: 0.04
    prims:
      - ellipsoid: {c: [0, 0.04, 0], r: [0.20, 0.15, 0.14]}
      - ellipsoid: {c: [0, 0.25, 0], r: [0.18, 0.17, 0.13]}
      - ellipsoid: {c: [0, 0.44, 0], r: [0.245, 0.16, 0.145]}
  coat:
    material: armor
    space: coatbase
    blend: 0.015
    prims:
      - cone: {a: [0, 0.09, 0.005], b: [0, -0.34, 0.01], r: [0.17, 0.25], shell: 0.045}
    cut:
      - box: {c: [0, -0.16, 0.21], half: [0.11, 0.35, 0.16]}
    paint:
      - material: trim
        stripes: {axis: y, at: [-0.30], width: 0.04}
  skirt_trim_L:
    material: trim
    space: coatbase
    prims:
      - tube: {pts: [[0.16, 0.03, 0.10], [0.19, -0.16, 0.10], [0.24, -0.31, 0.11]], r: [0.023, 0.014]}
  tabard:
    material: crimson
    space: coatbase
    prims:
      - extrude: {c: [0, -0.16, 0.23], depth: 0.035, profile: {polygon: [[-0.075, 0.20], [0.075, 0.20], [0.060, -0.23], [0, -0.33], [-0.060, -0.23]]}}
    paint:
      - material: trim
        stripes: {axis: x, at: [-0.064, 0.064], width: 0.018}
  cape:
    material: crimson
    space: coatbase
    blend: 0.008
    prims:
      - cone: {a: [0, 0.50, -0.17], b: [0, -0.43, -0.25], r: [0.18, 0.29], shell: 0.045}
    cut:
      - box: {c: [0, -0.10, 0.18], half: [0.13, 0.56, 0.31]}
      - cone: {a: [-0.14, -0.27, -0.28], b: [-0.19, -0.52, -0.30], r: [0.04, 0.08]}
      - cone: {a: [0.14, -0.27, -0.28], b: [0.19, -0.52, -0.30], r: [0.04, 0.08]}
    paint:
      - material: wine
        stripes: {axis: y, at: [-0.39], width: 0.035}
  pauldron_L:
