    space: shoulder_L
    prims:
      - ellipsoid: {c: [0.035, 0.035, 0], r: [0.145, 0.11, 0.14], shell: 0.045}
    paint:
      - material: trim
        stripes: {axis: y, at: [0.10, -0.02], width: 0.03}
