    peach_ponytail: {parts: [ponytail_main, ponytail_lock_left, ponytail_lock_right], min_px: 8, dirs: [s, se, e, n, w]}
    ribbon_bow: {parts: [hair_bow_left, hair_bow_right], min_px: 4, dirs: [s, se, n]}
    cape_fabric: {parts: [cape], min_px: 12, dirs: [se, e, ne, n, nw, w, sw]}
