      - tube: {pts: [[0, 0.02, -0.15], [0.02, -0.32, -0.24], [0.02, -0.72, -0.30], [0.01, -1.13, -0.35]], r: [0.095, 0.022]}
      - tube: {pts: [[0.10, 0.04, -0.12], [0.18, -0.30, -0.21], [0.19, -0.75, -0.29], [0.23, -1.01, -0.34]], r: [0.075, 0.018]}
