<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hollowmark Tactics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14171d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen phone app; a header, a scrolling page and bottom tabs. Battle is a full-bleed canvas. */
:root {
  --bg: #14171d; --panel: #1d222b; --panel2: #262c37; --line: #353d4b; --fg: #ece6d6; --muted: #9aa1ad;
  --brass: #d6a94e; --brass2: #8f6c2c; --ok: #7ed39a; --bad: #ef7a6a; --warn: #e8c060; --blue: #6aaefc; --red: #ff7a68;
  --sea: #24384a; --land: #b9a77e; --coast: #6d5f42; --river: #4f86ad; --hill: #7c6a48; --wood: #4f6a3a; --road: #4a3a26;
  --town: #d6a94e; --open: #e8dcb8; --cleared: #7ed39a; --lockc: #7a7466; --danger: #d0503a; --ink: #2a2218;
  --display: 'Alegreya SC', 'Palatino Linotype', Palatino, Georgia, serif;
  --body: 'Alegreya Sans', 'Gill Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--body); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .02em; text-wrap: balance; margin: 0; }
h2 { font-size: 22px; } h3 { font-size: 16px; color: var(--brass); margin: 18px 0 8px; }
small, .small { font-size: 13px; } .muted { color: var(--muted); } .ok { color: var(--ok); } .bad { color: var(--bad); } .gold { color: var(--brass); }
#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; }
main { flex: 1; overflow-y: auto; padding-block: 12px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hud { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); }
.clan { font-family: var(--display); font-size: 17px; color: var(--brass); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hudr { display: flex; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; }
.gil { font-weight: 700; } .day { color: var(--muted); }
.ico { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel2); display: grid; place-items: center; cursor: pointer; font-weight: 700; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--panel); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs button { background: none; border: 0; padding: 13px 0; color: var(--muted); font-family: var(--display); font-size: 15px; cursor: pointer; }
.tabs .on { color: var(--brass); box-shadow: inset 0 2px 0 var(--brass); }
.btn { display: block; width: 100%; padding: 12px 14px; margin-top: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; font-weight: 700; }
.btn.pri { background: linear-gradient(#e0b65c, #b8893a); color: #231a0b; border-color: #e8c47a; }
.btn.sm { display: inline-block; width: auto; margin: 0; padding: 7px 12px; min-width: 64px; font-variant-numeric: tabular-nums; }
.btn.ghost { background: none; } .btn.danger { color: var(--bad); border-color: #6a3a34; }
.btn:disabled { opacity: .45; cursor: default; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .row2 .btn { margin-top: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.card + .card { margin-top: 10px; }
.card.list { padding: 0; } .pad { padding: 12px; margin: 0; }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--brass2); color: var(--brass); margin-left: 4px; }
.pill.warn { color: var(--warn); border-color: #6a5a2a; } .pill.bad { color: var(--bad); border-color: #6a3a34; }
.pagehead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.back { background: none; border: 0; font-size: 28px; line-height: 1; color: var(--brass); cursor: pointer; padding: 0 4px; }
.hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
/* Title */
.scr-title main { display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #2a3140, var(--bg) 70%); }
.title { text-align: center; max-width: 340px; }
.crest { color: var(--brass); margin-bottom: 6px; }
.title h1 { font-size: 44px; line-height: 1; color: var(--fg); }
.title h1 span { color: var(--brass); font-size: 30px; letter-spacing: .3em; }
.tag { color: var(--muted); margin: 14px 0 22px; }
.fld { display: block; text-align: left; margin-top: 14px; } .fld span { font-size: 13px; color: var(--muted); }
.fld input { width: 100%; margin-top: 4px; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: inherit; }
/* World */
.world { margin: -12px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 10px; background: var(--sea); }
#world { display: block; width: 100%; max-height: 52vh; }
.node { cursor: pointer; } .node.locked { opacity: .55; }
.nlabel { font: 700 4.3px var(--display); fill: var(--ink); paint-order: stroke; stroke: rgba(240,228,196,.85); stroke-width: 1.4px; }
.lochead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.law { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; padding: 8px 10px; margin: 10px 0 4px; border: 1px solid var(--brass2); border-radius: 8px; background: #241f15; }
.lawk { font-family: var(--display); color: var(--brass); width: 100%; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
/* Clan */
.roster { display: grid; gap: 8px; }
.ucard { display: flex; gap: 10px; align-items: center; text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; }
.ucard.flat { background: none; border: 0; padding: 0; cursor: default; }
.ucard.on { border-color: var(--brass); background: #2a2618; } .ucard.dis { opacity: .5; cursor: default; }
.ucard .check { margin-left: auto; color: var(--brass); font-size: 20px; }
.pt { width: 48px; height: 48px; border-radius: 8px; background: radial-gradient(circle at 50% 70%, #3a4252, #22272f); flex: none; }
.pt.big { width: 72px; height: 72px; }
.uinfo { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; } .uinfo span { color: var(--muted); font-size: 13px; }
.uinfo .stats { font-variant-numeric: tabular-nums; }
.uhead { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.bar { display: inline-block; height: 6px; width: 90px; background: #0c0e12; border-radius: 3px; overflow: hidden; vertical-align: middle; }
.bar i { display: block; height: 100%; background: var(--brass); } .bar.exp { width: 100%; margin-top: 4px; } .bar.exp i { background: var(--blue); }
.kv { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); cursor: pointer; flex-wrap: wrap; }
.kv:last-child { border-bottom: 0; } .kv span { color: var(--muted); width: 84px; } .kv b { flex: 1; } .kv i { color: var(--muted); font-style: normal; }
.kv b small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; } .kv.dis { cursor: default; opacity: .55; }
.statgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
.statgrid div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 4px; text-align: center; }
.statgrid span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.statgrid b { font-variant-numeric: tabular-nums; font-size: 16px; }
.abrow { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.abrow:last-child { border: 0; } .abrow > div:first-child { min-width: 0; } .abrow.m b { color: var(--ok); }
.abstate { flex: none; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; max-width: 45%; }
.apn { font-size: 12px; color: var(--brass); font-variant-numeric: tabular-nums; }
.kind { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.teach { display: inline-block; font-size: 12px; margin: 3px 6px 0 0; padding: 1px 7px; border-radius: 4px; background: #2c2618; color: var(--brass); }
.teach small { color: var(--muted); font-size: 11px; } .teach.m { background: #1c3024; color: var(--ok); } .teach.no { opacity: .5; }
/* Sheets */
#sheet { position: fixed; inset: 0; z-index: 50; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
.panel { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 82%; overflow-y: auto; background: var(--panel); border-top: 2px solid var(--brass2); border-radius: 14px 14px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panel h3 { margin-top: 0; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; padding: 10px 12px; margin-top: 6px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.opt small { display: block; color: var(--muted); } .opt.cur { border-color: var(--brass); } .opt:disabled { opacity: .45; cursor: default; }
.optl { min-width: 0; flex: 1; } .cost { color: var(--blue); font-size: 13px; flex: none; font-variant-numeric: tabular-nums; }
.agrp { font-family: var(--display); color: var(--brass); margin: 12px 0 0; font-size: 14px; }
.ablist { max-height: 56vh; overflow-y: auto; }
.lawwarn { font-size: 11px; color: #231a0b; background: var(--bad); border-radius: 4px; padding: 0 6px; font-weight: 700; }
.lawfav { font-size: 11px; color: #231a0b; background: var(--ok); border-radius: 4px; padding: 0 6px; font-weight: 700; }
.jobgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.job { text-align: left; padding: 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 12px 1fr; gap: 0 8px; align-items: center; }
.job small { grid-column: 2; color: var(--muted); font-size: 12px; } .job.cur { border-color: var(--brass); } .job.lock { opacity: .5; cursor: default; }
.sw { width: 12px; height: 12px; border-radius: 3px; }
.guide p { margin: 0 0 10px; }
.toggle { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
#toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 60; background: #2a2618; border: 1px solid var(--brass2); color: var(--fg); padding: 8px 14px; border-radius: 99px; font-size: 14px; max-width: 90%; text-align: center; }
/* Shop */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 4px 0 6px; }
.seg button { background: var(--panel); border: 0; padding: 9px 0; cursor: pointer; color: var(--muted); }
.seg .on { background: var(--panel2); color: var(--brass); font-weight: 700; }
.keeper { font-style: italic; color: var(--muted); margin: 0 0 10px; }
.shoprow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.shoprow:last-child { border: 0; } .shoprow small { display: block; color: var(--muted); }
.need { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--bad); margin-top: 4px; } .need .have { color: var(--ok); }
.mission p { margin: 8px 0; }
.brief { font-style: italic; color: var(--muted); margin: 0 0 6px; }
.stick { position: sticky; bottom: -24px; padding: 10px 0 14px; background: linear-gradient(transparent, var(--bg) 35%); }
.result { text-align: center; padding: 14px 0 6px; } .result h1 { font-size: 40px; } .result.win h1 { color: var(--brass); } .result.loss h1 { color: var(--bad); }
.scr-results .roster { margin-top: 10px; } .scr-results .ucard.flat { background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; }
/* Battle */
.scr-battle { max-width: none !important; }
.bwrap { position: fixed; inset: 0; display: flex; flex-direction: column; background: #101216; }
.btop { padding: calc(6px + env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px)); background: rgba(16,18,22,.92); border-bottom: 1px solid var(--line); z-index: 2; }
.order { display: flex; gap: 4px; overflow: hidden; }
.oc { width: 34px; height: 34px; flex: none; border-radius: 7px; border: 2px solid; background: #22272f; overflow: hidden; }
.oc img { width: 100%; height: 100%; } .oc.t0 { border-color: var(--blue); } .oc.t1 { border-color: var(--red); }
.oc.cur { outline: 2px solid var(--brass); outline-offset: 1px; }
.lawbar { display: flex; align-items: center; gap: 12px; font-size: 12px; margin-top: 6px; color: var(--muted); }
.lawbar b { color: var(--fg); } .lawbar .ico { margin-left: auto; width: 30px; height: 30px; }
#bv { flex: 1; width: 100%; min-height: 0; touch-action: none; display: block; }
.vctl { position: absolute; right: max(8px, env(safe-area-inset-right, 0px)); top: calc(96px + env(safe-area-inset-top, 0px)); display: grid; gap: 6px; }
.vctl .ico { background: rgba(38,44,55,.85); }
.blog { position: absolute; left: 0; right: 0; bottom: calc(var(--bp, 150px) + 6px); text-align: center; font-size: 14px; pointer-events: none; text-shadow: 0 1px 3px #000; padding: 0 16px; }
.blog.fade { animation: fade 2.4s forwards; }
@keyframes fade { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
.bpanel { min-height: 150px; background: var(--panel); border-top: 2px solid var(--brass2); padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); z-index: 2; }
.bu { display: flex; gap: 10px; align-items: center; } .bui { flex: 1; min-width: 0; } .bui small { color: var(--muted); font-variant-numeric: tabular-nums; }
.hpb { height: 6px; background: #0c0e12; border-radius: 3px; overflow: hidden; margin: 3px 0; } .hpb i { display: block; height: 100%; background: var(--ok); }
.sts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; } .st { font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--c); color: var(--c); }
.jp { font-size: 11px; color: #231a0b; background: var(--brass); border-radius: 4px; padding: 0 5px; font-weight: 700; }
.card-y { font-size: 11px; color: #231a0b; background: var(--warn); border-radius: 3px; padding: 0 5px; }
.cmds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.cmds button { padding: 11px 0; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); font-weight: 700; cursor: pointer; font-family: var(--display); }
.cmds button:disabled { opacity: .35; cursor: default; } .cmds .go { background: linear-gradient(#e0b65c, #b8893a); color: #231a0b; border-color: #e8c47a; grid-column: span 2; }
.hintp { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.statline { font-size: 13px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.tgt .tgth { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.trow { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; font-size: 14px; font-variant-numeric: tabular-nums; }
.trow.t0 b { color: var(--blue); } .trow.t1 b { color: var(--red); }
.facepad { display: grid; grid-template-columns: repeat(2, 64px); gap: 6px; justify-content: center; margin-top: 8px; }
.facepad button { height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); font-size: 22px; cursor: pointer; }
.facepad .on { border-color: var(--brass); color: var(--brass); }
.bend { text-align: center; font-family: var(--display); font-size: 30px; padding: 30px 0; } .bend.win { color: var(--brass); } .bend.loss { color: var(--bad); }
@media (prefers-reduced-motion: reduce) { .blog.fade { animation: none; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
